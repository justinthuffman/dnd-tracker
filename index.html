<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crisis in Waterdeep</title>
<link rel="icon" type="image/png" href="https://www.dungeonsanddragons.com/assets/favicons/favicon-16x16.png">
<style>
:root{
  --bg:#17140f; --panel:#211d16; --panel2:#2a251c; --border:#3c3323;
  --ink:#eee6d3; --ink-dim:#b8ab8e; --gold:#c9a24b; --gold-dim:#8a7237;
  --maroon:#8a2f2f; --maroon-bright:#b8433f;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); display:flex; flex-direction:column; align-items:center;
  padding:64px 20px 48px;
}
.title-block{text-align:center; margin-bottom:56px;}
.eyebrow-rule{width:64px; height:1px; background:var(--gold-dim); margin:0 auto 18px;}
h1{
  font-family:var(--font-display); font-weight:normal; font-size:2.6rem;
  letter-spacing:0.015em; color:var(--gold); margin:0;
}
.subtitle{
  font-family:var(--font-display); font-style:italic; color:var(--ink-dim);
  font-size:1rem; margin-top:10px;
}
.roster{
  display:grid; grid-template-columns:repeat(4, minmax(150px, 1fr));
  gap:14px; width:100%; max-width:780px;
}
@media (max-width:640px){
  .roster{grid-template-columns:repeat(2, 1fr);}
  h1{font-size:2.1rem;}
}
.plaque{
  position:relative; display:block; text-decoration:none;
  background:var(--panel); border:1px solid var(--border);
  padding:26px 14px 20px; text-align:center; border-radius:2px;
  transition:border-color .15s, background .15s;
}
.plaque::before{
  content:''; position:absolute; top:0; left:18px; right:18px; height:2px;
  background:var(--gold-dim); opacity:0.55;
}
.plaque:hover{border-color:var(--gold-dim); background:var(--panel2);}
.plaque:hover::before{background:var(--gold); opacity:1;}
.plaque:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
.plaque-name{
  font-family:var(--font-display); font-size:1.25rem; color:var(--ink);
  letter-spacing:0.01em;
}
.plaque:hover .plaque-name{color:var(--gold);}
.plaque-sub{
  margin-top:6px; font-size:0.7rem; color:var(--ink-dim);
  text-transform:uppercase; letter-spacing:0.08em;
}
footer{margin-top:56px; font-size:0.75rem; color:var(--ink-dim); text-align:center;}
</style>
</head>
<body>

<div class="title-block">
  <div class="eyebrow-rule"></div>
  <h1>Crisis in Waterdeep</h1>
  <div class="subtitle">the party</div>
</div>

<div class="roster">
  <a class="plaque" href="dnd_tracker.html?sheet=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2F1vIvEke6E12m7il5voB2n5rJAqwgJeWf_2BZYJSKpYgU%2Fedit%3Fgid%3D359784640%23gid%3D359784640&name=Krunk" target="_blank" rel="noopener">
    <div class="plaque-name">Krunk</div>
    <div class="plaque-sub">Sheet</div>
  </a>
  <a class="plaque" href="dnd_tracker.html?sheet=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2F1mS5Z2jgmi4U-bdEPP0JvZIkI-7puhWGjwlF8i6JIYbo%2Fedit%3Fgid%3D359784640%23gid%3D359784640&name=Venthor" target="_blank" rel="noopener">
    <div class="plaque-name">Venthor</div>
    <div class="plaque-sub">Sheet</div>
  </a>
  <a class="plaque" href="dnd_tracker.html?sheet=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2F1GqXXArCfLC42oVTF9XVrbNeKbw868HF1ih2S7VpX8jk%2Fedit%3Fgid%3D359784640%23gid%3D359784640&name=Ezlo" target="_blank" rel="noopener">
    <div class="plaque-name">Ezlo</div>
    <div class="plaque-sub">Sheet</div>
  </a>
  <a class="plaque" href="dnd_tracker.html?sheet=https%3A%2F%2Fdocs.google.com%2Fspreadsheets%2Fd%2F14TFj-bb1ixAUl9bw_tNdcIpWtnYxeV8JW5f2kIbiW_Q%2Fedit%3Fgid%3D359784640%23gid%3D359784640&name=Bel" target="_blank" rel="noopener">
    <div class="plaque-name">Bel</div>
    <div class="plaque-sub">Sheet</div>
  </a>
</div>

<footer>Click a name to open that character's sheet.</footer>

</body>
</html>
