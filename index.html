<style>
:root{
  --bg:#0c1b26; --panel:#13293d; --panel2:#1b3750; --border:#2b4d68;
  --ink:#e4edf2; --ink-dim:#8fa6b8; --sea:#4fb8a6; --sea-dim:#2f7d70;
  --orange:#d97b3f; --orange-bright:#ea9257;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); display:flex; flex-direction:column; align-items:center;
  padding:64px 20px 48px;
}
.title-block{text-align:center; margin-bottom:56px;}
.eyebrow-rule{width:64px; height:1px; background:var(--sea-dim); margin:0 auto 18px;}
h1{
  font-family:var(--font-display); font-weight:normal; font-size:2.6rem;
  letter-spacing:0.015em; color:var(--sea); margin:0;
}
.subtitle{
  font-family:var(--font-display); font-style:italic; color:var(--ink-dim);
  font-size:1rem; margin-top:10px;
}
.roster{
  display:grid; grid-template-columns:repeat(4, minmax(150px, 1fr));
  gap:14px; width:100%; max-width:780px;
}
@media (max-width:640px){
  .roster{grid-template-columns:repeat(2, 1fr);}
  h1{font-size:2.1rem;}
}
.plaque{
  position:relative; display:block; text-decoration:none;
  background:var(--panel); border:1px solid var(--border);
  padding:26px 14px 20px; text-align:center; border-radius:2px;
  transition:border-color .15s, background .15s;
}
.plaque::before{
  content:''; position:absolute; top:0; left:18px; right:18px; height:2px;
  background:var(--sea-dim); opacity:0.55;
}
.plaque:hover{border-color:var(--sea-dim); background:var(--panel2);}
.plaque:hover::before{background:var(--sea); opacity:1;}
.plaque:focus-visible{outline:2px solid var(--sea); outline-offset:3px;}
.plaque-name{
  font-family:var(--font-display); font-size:1.25rem; color:var(--ink);
  letter-spacing:0.01em;
}
.plaque:hover .plaque-name{color:var(--sea);}
.plaque-sub{
  margin-top:6px; font-size:0.7rem; color:var(--ink-dim);
  text-transform:uppercase; letter-spacing:0.08em;
}
footer{margin-top:56px; font-size:0.75rem; color:var(--ink-dim); text-align:center;}
</style>
</head>
<body>

<div class="title-block">

</div>

  </a>

  </a>
